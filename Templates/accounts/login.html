

<!DOCTYPE html>
{% load static %}
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | MoticAfrica</title>

    <link href="{% static 'assets/vendor/bootstrap/css/bootstrap.min.css' %}" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background:
                linear-gradient(rgba(0, 0, 0, 0.70), rgba(0, 0, 0, 0.70)),
                url("{% static 'assets/img/choma/img.png' %}") center/cover no-repeat fixed;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 15px;
        }

        .auth-wrapper {
            width: 100%;
            max-width: 450px;
        }

        .auth-card {
            background: rgba(255, 255, 255, 0.97);
            border-radius: 18px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
        }

        .brand {
            text-align: center;
            margin-bottom: 30px;
        }

        .brand h1 {
            font-size: 30px;
            font-weight: 800;
            margin: 0;
            color: #111;
        }

        .brand span {
            color: #f5b400;
        }

        .brand p {
            color: #777;
            margin-top: 8px;
        }

        .auth-title {
            text-align: center;
            font-weight: 700;
            margin-bottom: 25px;
            color: #222;
        }

        .form-label {
            font-weight: 600;
            color: #333;
            margin-bottom: 7px;
        }

        .form-control {
            height: 52px;
            border-radius: 10px;
            border: 1px solid #ddd;
            padding: 12px 15px;
        }

        .form-control:focus {
            border-color: #f5b400;
            box-shadow: 0 0 0 0.2rem rgba(245, 180, 0, 0.15);
        }

        .login-btn {
            width: 100%;
            height: 52px;
            border: none;
            border-radius: 10px;
            background: #f5b400;
            color: #111;
            font-weight: 700;
            font-size: 16px;
            transition: 0.3s;
        }

        .login-btn:hover {
            background: #d99e00;
            transform: translateY(-2px);
        }

        .error-message {
            background: #ffe5e5;
            color: #b00020;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .bottom-text {
            text-align: center;
            margin-top: 22px;
            color: #777;
        }

        .bottom-text a {
            color: #d99e00;
            font-weight: 700;
            text-decoration: none;
        }

        .bottom-text a:hover {
            text-decoration: underline;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: white;
            text-decoration: none;
            font-weight: 600;
        }

        .back-home:hover {
            color: #f5b400;
        }

        @media (max-width: 576px) {
            .auth-card {
                padding: 30px 22px;
            }

            .brand h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

<div class="auth-wrapper">

    <div class="auth-card">

        <div class="brand">
            <h1>Motic<span>Africa</span></h1>
            <p>Kenya Mega Choma Battle</p>
        </div>

        <h2 class="auth-title">Welcome Back</h2>

        {% if error %}
            <div class="error-message">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <div class="mb-3">

                <label class="form-label">
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    class="form-control"
                    placeholder="Enter your username"
                    required
                >

            </div>

            <div class="mb-4">

                <label class="form-label">
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    class="form-control"
                    placeholder="Enter your password"
                    required
                >

            </div>

            <button type="submit" class="login-btn">
                Login
            </button>

        </form>

        <div class="bottom-text">
            Don't have an account?
            <a href="{% url 'register' %}">Create Account</a>
        </div>

    </div>

    <a href="{% url 'index' %}" class="back-home">
        ← Back to MoticAfrica
    </a>

</div>

</body>
</html>
